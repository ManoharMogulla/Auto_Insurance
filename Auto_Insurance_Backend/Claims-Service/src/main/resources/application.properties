spring.application.name=Claims-Service
server.port=${SERVER_PORT:8088}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prj_claimsdb?createDatabaseIfNotExist=true}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

security.jwt.secret=${JWT_SECRET:my-local-insurance-jwt-secret-key-123456789}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


info.app.name=${spring.application.name}
info.app.description=Claims Microservices
info.app.version=1.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true