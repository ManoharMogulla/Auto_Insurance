spring.application.name=authentication-service
server.port=${SERVER_PORT:1236}

spring.datasource.url=${AUTH_DB_URL:jdbc:mysql://localhost:3306/prj_authenticationdb?createDatabaseIfNotExist=true}
spring.datasource.username=${AUTH_DB_USERNAME:root}
spring.datasource.password=${AUTH_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create

security.jwt.secret=${JWT_SECRET:my-local-insurance-jwt-secret-key-123456789}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
customer.service.url=${CUSTOMER_SERVICE_URL:http://localhost:8081}
internal.service.token=${INTERNAL_SERVICE_TOKEN:local-dev-internal-service-token-change-me}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=${spring.application.name}
info.app.description=Authentication Microservices
info.app.version=1.0.0

