spring.application.name=CustomerMicroservices
server.port=${SERVER_PORT:8081}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/prj_customerMicroservices?createDatabaseIfNotExist=true}
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JWT
security.jwt.secret=${JWT_SECRET:my-local-insurance-jwt-secret-key-123456789}

# Internal service authentication
internal.service.token=${INTERNAL_SERVICE_TOKEN:local-dev-internal-service-token-change-me}

# Frontend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# spring.jpa.hibernate.ddl-auto=create

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

info.app.name=${spring.application.name}
info.app.description=Customer microservices
info.app.version=1.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true


