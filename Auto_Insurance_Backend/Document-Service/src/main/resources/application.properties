spring.application.name=Document-Service
server.port=${SERVER_PORT:8087}

spring.datasource.url=${DOCUMENT_DB_URL:jdbc:mysql://localhost:3306/prj_documentdb?createDatabaseIfNotExist=true}
spring.datasource.username=${DOCUMENT_DB_USERNAME:root}
spring.datasource.password=${DOCUMENT_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

document.storage.location=${DOCUMENT_STORAGE_LOCATION:./generated-documents}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

security.jwt.secret=${JWT_SECRET:my-local-insurance-jwt-secret-key-123456789}
services.policy.url=${POLICY_SERVICE_URL:http://localhost:8082/api/policy}
services.customer.url=${CUSTOMER_SERVICE_URL:http://localhost:8081/customer}
services.premium.url=${PREMIUM_SERVICE_URL:http://localhost:8085}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8084/api/payment}

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}


info.app.name=${spring.application.name}
info.app.description=Document Microservices
info.app.version=1.0.0

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true
